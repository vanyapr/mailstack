# Existing Mox on host loopback requires host networking for the BFF. Next.js
# itself binds only loopback. No existing Mox files, listeners or data are owned.
name: mailstack-nextjs
services:
  web:
    image: ${WEB_IMAGE:?Verified Next.js image digest required}
    pull_policy: never
    container_name: mailstack-nextjs-web
    network_mode: host
    user: "10001:10001"
    command: [node, server.js]
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "3100"
      APP_ORIGIN: ${APP_ORIGIN:?HTTPS origin required}
      MOX_ORIGIN: ${MOX_ORIGIN:?Existing trusted Mox URL required}
      TRUST_NGINX: "1"
      SYSTEM_STATUS_PATH: /run/mailstack/status.json
      MAILSTACK_PUSH_DIR: /var/lib/mailstack-push
      MAILSTACK_PUSH_ENABLED: ${MAILSTACK_PUSH_ENABLED:-0}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:mode=1777,size=64m"]
    volumes: ["${MAILSTACK_ROOT:?}/report:/run/mailstack:ro", "${MAILSTACK_ROOT:?}/private/push:/var/lib/mailstack-push"]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
